<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Law of Power</title>
    <link rel="stylesheet" href="style.css">
</head>
 
<body>
 
<div class="widget">
 
    <h1>🍃 Daily Law</h1>
 
    <div class="card">
        <h2 id="law-title"></h2>
        <p id="law-text"></p>
    </div>
 
    <div class="card">
        <h2>🎯 Today's Challenge</h2>
        <p id="challenge"></p>
    </div>
 
    <div class="card">
        <h2>💭 Reflection</h2>
        <textarea id="reflection" placeholder="Write your thoughts here..."></textarea>
        <button id="saveReflection">Save Reflection</button>
        <p id="savedMessage"></p>
    </div>
 
    <div class="card">
        <label>
            <input type="checkbox" id="completed">
            Challenge completed
        </label>
 
        <p id="progress"></p>
    </div>
 
    <button id="randomLaw">Give Me Another Law</button>
 
</div>
 
<script src="script.js"></script>
 
</body>
</html>
